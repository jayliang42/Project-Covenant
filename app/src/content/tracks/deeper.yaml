# 多年信徒 | Going deeper
title: { zh: 扎根成长, en: Going deeper }
who: { zh: 我信主多年，想读得更深、更扎实, en: I've followed Jesus for years and want deeper roots }
tagline: { zh: 圣经神学、教会历史、教义、带领他人, en: "Biblical theology, church history, doctrine, and leading others" }
description:
  zh: 为信主多年的弟兄姊妹准备：顺着圣约与主题线读整本圣经，学会读不同文体的书卷和使用工具书，把经文放回历史处境，了解教会历史和几个重要教义，并学习带领查经。
  en: For long-time believers. Trace covenant and theme lines through the whole Bible, learn to read different kinds of books and use study tools, read texts in their historical setting, learn church history and several key doctrines, and learn to lead studies.
color: "#4a4f9c"
art: river-of-life
units:
  - id: whole-bible
    title: { zh: 整本圣经的脉络, en: The shape of the whole Bible }
    summary: { zh: 圣约、国度和圣殿, en: "Covenant, kingdom, and temple" }
  - id: reading-books
    title: { zh: 读不同的书卷, en: Reading different kinds of books }
    summary: { zh: 诗篇智慧书、先知书、书信、启示录、原文和工具书, en: "Psalms and wisdom, prophets, letters, Revelation, original languages and tools" }
  - id: background
    title: { zh: 历史背景, en: Historical background }
    summary: { zh: 古代近东、第二圣殿、罗马城市, en: "Ancient Near East, Second Temple, Roman cities" }
  - id: church-history
    title: { zh: 两千年的教会, en: Two thousand years of the church }
    summary: { zh: 早期信经、宗教改革、中文圣经, en: "Early creeds, the Reformation, the Chinese Bible" }
  - id: doctrine
    title: { zh: 更深地认识救恩, en: Understanding salvation more deeply }
    summary: { zh: 称义和成圣、十字架、神的主权和人的选择, en: "Justification and sanctification, the cross, sovereignty and choice" }
  - id: leading
    title: { zh: 带领他人, en: Leading others }
    summary: { zh: 带查经和处理小组难处, en: Leading studies and handling hard moments }
