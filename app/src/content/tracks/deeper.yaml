# 多年信徒 | Going deeper
title: { zh: 扎根成长, en: Going deeper }
who: { zh: 我信主多年，想读得更深、更扎实, en: I've followed Jesus for years and want deeper roots }
tagline: { zh: 圣经神学、逐卷导读、教会历史、教义、伦理、带领他人, en: "Biblical theology, book guides, church history, doctrine, ethics, and leading others" }
description:
  zh: 为信主多年的弟兄姊妹准备：顺着圣约与主题线读整本圣经，学会读不同文体的书卷和使用工具书，逐卷读几本重要的书，把经文放回历史处境，了解教会历史、几个重要教义和各传统的分歧，思考婚姻和性的伦理，并学习带领查经。
  en: For long-time believers. Trace covenant and theme lines through the whole Bible, learn to read different kinds of books and use study tools, work through several key books one by one, read texts in their historical setting, learn church history, several key doctrines, and where the traditions differ, think through the ethics of marriage and sexuality, and learn to lead studies.
color: "#4a4f9c"
art: river-of-life
units:
  - id: whole-bible
    title: { zh: 整本圣经的脉络, en: The shape of the whole Bible }
    summary: { zh: 圣约、国度、圣殿，以及怎样在旧约里读出基督, en: "Covenant, kingdom, temple, and reading Christ in the Old Testament" }
  - id: reading-books
    title: { zh: 读不同的书卷, en: Reading different kinds of books }
    summary: { zh: 叙事和律法、诗篇智慧书、先知书、福音书、书信、启示录、原文和工具书, en: "Narrative and law, Psalms and wisdom, prophets, Gospels, letters, Revelation, original languages and tools" }
  - id: book-guides
    title: { zh: 逐卷导读, en: Book guides }
    summary: { zh: 创世记、出埃及记、诗篇、以赛亚书、马可、约翰、罗马书、希伯来书, en: "Genesis, Exodus, Psalms, Isaiah, Mark, John, Romans, Hebrews" }
  - id: background
    title: { zh: 历史背景, en: Historical background }
    summary: { zh: 古代近东、第二圣殿、罗马城市, en: "Ancient Near East, Second Temple, Roman cities" }
  - id: church-history
    title: { zh: 两千年的教会, en: Two thousand years of the church }
    summary: { zh: 早期信经、东西教会分裂、宗教改革、近代宣教、中文圣经、中国教会（至 1949 年）、20 世纪的教会, en: "Early creeds, the East-West schism, the Reformation, modern missions, the Chinese Bible, the church in China to 1949, the twentieth-century church" }
  - id: doctrine
    title: { zh: 更深地认识救恩, en: Understanding salvation more deeply }
    summary: { zh: 称义和成圣、十字架、神的主权和人的选择, en: "Justification and sanctification, the cross, sovereignty and choice" }
  - id: church-teaching
    title: { zh: 各传统的不同教导, en: Where the traditions differ }
    summary: { zh: 圣经的权威和正典、基督再来、洗礼和圣餐、属灵恩赐、女性的服事、教会治理, en: "Scripture's authority and canon, Christ's return, baptism and the Lord's Supper, spiritual gifts, women in ministry, church government" }
  - id: ethics
    title: { zh: 婚姻和性的伦理, en: The ethics of marriage and sexuality }
    summary: { zh: 婚姻、离婚和再婚；性伦理, en: "Marriage, divorce, and remarriage; sexual ethics" }
  - id: leading
    title: { zh: 带领他人, en: Leading others }
    summary: { zh: 带查经和处理小组难处, en: Leading studies and handling hard moments }
