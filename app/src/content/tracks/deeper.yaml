# 多年信徒 | Going deeper
title: { zh: 扎根成长, en: Going deeper }
who: { zh: 我信主多年，想读得更深、更扎实, en: I've followed Jesus for years and want deeper roots }
tagline: { zh: 圣经神学、逐卷导读、教会历史、教义、伦理、带领他人, en: "Biblical theology, book guides, church history, doctrine, ethics, and leading others" }
description:
  zh: 为信主多年的弟兄姊妹准备：顺着圣约与主题线读整本圣经，学会读不同文体的书卷和使用工具书，逐卷读几本重要的书，把经文放回历史处境，了解教会历史、几个重要教义和各传统的分歧，思考婚姻、性、安息日和战争等伦理问题，并学习带领查经和陪伴受苦的人。
  en: For long-time believers. Trace covenant and theme lines through the whole Bible, learn to read different kinds of books and use study tools, work through several key books one by one, read texts in their historical setting, learn church history, several key doctrines, and where the traditions differ, think through ethical questions such as marriage, sexuality, the Sabbath, and war, and learn to lead studies and care for those who suffer.
color: "#4a4f9c"
art: river-of-life
units:
  - id: whole-bible
    title: { zh: 整本圣经的脉络, en: The shape of the whole Bible }
    summary: { zh: 圣约、国度、圣殿，以及怎样在旧约里读出基督, en: "Covenant, kingdom, temple, and reading Christ in the Old Testament" }
  - id: reading-books
    title: { zh: 读不同的书卷, en: Reading different kinds of books }
    summary: { zh: 叙事和律法、诗篇智慧书、先知书、福音书、书信、启示录、原文和工具书, en: "Narrative and law, Psalms and wisdom, prophets, Gospels, letters, Revelation, original languages and tools" }
  - id: book-guides
    title: { zh: 逐卷导读, en: Book guides }
    summary: { zh: 创世记、出埃及记、约伯记、诗篇、以赛亚书、马可、约翰、使徒行传、罗马书、以弗所书、希伯来书、雅各书, en: "Genesis, Exodus, Job, Psalms, Isaiah, Mark, John, Acts, Romans, Ephesians, Hebrews, James" }
  - id: background
    title: { zh: 历史背景, en: Historical background }
    summary: { zh: 古代近东、第二圣殿、罗马城市, en: "Ancient Near East, Second Temple, Roman cities" }
  - id: church-history
    title: { zh: 两千年的教会, en: Two thousand years of the church }
    summary: { zh: 早期信经、东西教会分裂、中世纪、宗教改革、敬虔运动和大觉醒、近代宣教、中文圣经、中国教会（至 1949 年）、20 世纪的教会, en: "Early creeds, the East-West schism, the Middle Ages, the Reformation, Pietism and the Great Awakening, modern missions, the Chinese Bible, the church in China to 1949, the twentieth-century church" }
  - id: doctrine
    title: { zh: 更深地认识救恩, en: Understanding salvation more deeply }
    summary: { zh: 称义和成圣、十字架、神的主权和人的选择、人和原罪、神的属性, en: "Justification and sanctification, the cross, sovereignty and choice, humanity and original sin, the attributes of God" }
  - id: church-teaching
    title: { zh: 各传统的不同教导, en: Where the traditions differ }
    summary: { zh: 圣经的权威和正典、基督再来、洗礼和圣餐、属灵恩赐、女性的服事、教会治理、马利亚, en: "Scripture's authority and canon, Christ's return, baptism and the Lord's Supper, spiritual gifts, women in ministry, church government, Mary" }
  - id: ethics
    title: { zh: 婚姻和性的伦理, en: The ethics of marriage and sexuality }
    summary: { zh: 婚姻、离婚和再婚；性伦理；安息日和主日；战争与和平, en: "Marriage, divorce, and remarriage; sexual ethics; the Sabbath and the Lord's Day; war and peace" }
  - id: leading
    title: { zh: 带领他人, en: Leading others }
    summary: { zh: 带查经、处理小组难处、陪伴受苦的人, en: "Leading studies, handling hard moments, and caring for those who suffer" }
