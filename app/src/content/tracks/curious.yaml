# 对圣经好奇 | Curious about the Bible
title: { zh: 对圣经好奇, en: Curious }
who: { zh: 我对圣经好奇，想知道它在讲什么, en: I'm curious what the Bible is about }
tagline: { zh: 不需要任何背景，从零开始, en: No background needed. Start from zero. }
description:
  zh: 每课几分钟。了解圣经是一本什么样的书，它讲的大故事，故事的中心人物，以及故事怎样结局。不预设你信什么。
  en: A few minutes per lesson. Learn what kind of book the Bible is, the big story it tells, the person at its centre, and how the story ends. No faith commitment is assumed.
color: "#c27a1a"
art: bible-library
units:
  - id: what-is-it
    title: { zh: 圣经是一本什么书, en: What kind of book is it? }
    summary: { zh: 66 卷、两约、多种文体、怎样查经文、常见的词, en: "66 books, two testaments, kinds of writing, finding a verse, common words" }
  - id: big-story
    title: { zh: 一条大故事, en: One big story }
    summary: { zh: 从创造到被掳归回，以及节期和大卫, en: "From creation to the return from exile, with the feasts and David" }
  - id: jesus
    title: { zh: 耶稣是谁, en: Who is Jesus? }
    summary: { zh: 他的降生、教导、神迹、遇见的人、死和复活, en: "His birth, teaching, miracles, the people he met, his death and resurrection" }
  - id: story-end
    title: { zh: 故事的结局, en: How the story ends }
    summary: { zh: 教会的开始和新天新地, en: The church begins and all things are made new }
